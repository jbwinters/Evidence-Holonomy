[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "uec-holonomy"
version = "0.1.0"
description = "Universal Evidence Curvature (UEC): KL-rate holonomy, entropy production estimation, and Arrow-of-Time demos"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Josh Winters", email = "josh@friendmachine.co" }
]
keywords = ["entropy production", "information theory", "universal coding", "holonomy", "arrow of time", "KL divergence"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
audio = ["scipy>=1.8"]
image = ["pillow>=8.0"]
video = ["imageio>=2.9", "imageio[ffmpeg]"]
ml = ["scikit-learn>=1.0"]
astrobiology = ["statsmodels>=0.14", "scipy>=1.8", "scikit-learn>=1.0", "pandas>=1.5"]
all = ["scipy>=1.8", "pillow>=8.0", "imageio>=2.9", "imageio[ffmpeg]", "scikit-learn>=1.0", "statsmodels>=0.14", "pandas>=1.5"]
paper = ["pandas>=1.5", "matplotlib>=3.5"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/jbwinters/Evidence-Holonomy"
Issues = "https://github.com/jbwinters/Evidence-Holonomy/issues"

[project.scripts]
uec-battery = "uec.cli:run_battery"
uec-aot = "uec.cli:run_aot"

[tool.hatch.build]
packages = ["src/uec"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer statistical checks"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
